[project]
name = "pyp2p-forca"
version = "0.1.0"
description = "Jogo da Forca P2P — Redes de Computadores"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = ["ruff", "mypy", "pre-commit"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "scripts"]
